[project]
name = "course-knowledge-platform"
version = "0.1.0"
description = "GraphRAG teaching platform for course knowledge"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "openai>=1.0,<3",
  "azure-ai-contentsafety>=1.0,<2",
  "mcp[cli]>=1.27,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "azure-storage-blob>=12.24,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
course-knowledge = "course_knowledge.cli:main"
course-knowledge-author-mcp = "course_knowledge.mcp_servers:run_author"
course-knowledge-student-mcp = "course_knowledge.mcp_servers:run_student"
course-knowledge-api = "course_knowledge.api:run"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
